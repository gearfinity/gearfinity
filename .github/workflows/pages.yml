name: Deploy module viewer to Pages

# Publishes the web/ viewer (model-viewer + .glb mock models) to GitHub Pages.
# Runs on changes to web/ on the default branch, or manually.

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS, in case models are LFS-tracked)
        uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/configure-pages@v5
      - name: Upload web/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
